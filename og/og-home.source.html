<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>og-home source</title>
<!-- Source for og/og-home.png (1200x630). Render: headless Chrome, window 1200x630, screenshot. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1623;--panel:#111827;--blue:#2d7dd2;--yellow:#faed36;--white:#fff;--grey:#8892a4;--body:#c9d1dc;--border:rgba(255,255,255,.09)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Montserrat',sans-serif;background:var(--navy);color:var(--white);-webkit-font-smoothing:antialiased;position:relative}
.bar{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--blue),var(--yellow))}
.glow{position:absolute;top:-180px;right:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(45,125,210,.22),rgba(45,125,210,0) 65%)}
.wrap{position:absolute;inset:0;padding:40px 68px 38px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:40px;width:auto;display:block}
.brand span{font-size:14px;font-weight:700;letter-spacing:5px;text-transform:uppercase;padding-left:16px;border-left:1px solid rgba(255,255,255,.25);line-height:22px}
.eyebrow{margin-top:72px;font-size:14px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--blue)}
h1{margin-top:14px;font-size:92px;font-weight:800;line-height:1.0;letter-spacing:-2.5px}
h1 span{color:var(--yellow)}
.desc{margin-top:22px;max-width:860px;font-size:21px;line-height:1.5;color:var(--body);font-weight:400}
.foot{position:absolute;left:68px;right:68px;bottom:38px;display:flex;align-items:flex-end;justify-content:space-between}
.stats{display:flex;gap:10px}
.stat{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:12px 18px 11px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat i{display:block;font-style:normal;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-top:3px}
.url{text-align:right}
.url b{display:block;font-size:19px;font-weight:700}
.url i{display:block;font-style:normal;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-top:5px}
</style>
</head>
<body>
<div class="bar"></div>
<div class="glow"></div>
<div class="wrap">
  <div class="brand"><img src="https://classes.cnattitle.com/img/cnat-logo-white.png" alt="CNAT Title"><span>Education</span></div>
  <p class="eyebrow">CE Classes &amp; Events in Texas</p>
  <h1>Learn. Connect.<br><span>Earn CE.</span></h1>
  <p class="desc">Hands-on CE classes and networking events for Texas real estate pros, in person and via Zoom. Expert instructors. Practical content. No fluff.</p>
</div>
<div class="foot">
  <div class="stats">
    <div class="stat"><b>14</b><i>Courses</i></div>
    <div class="stat"><b>1&ndash;4</b><i>CE Hours</i></div>
    <div class="stat"><b>10034</b><i>TREC Provider</i></div>
  </div>
  <div class="url"><b>classes.cnattitle.com</b><i>Register Today</i></div>
</div>
</body>
</html>
