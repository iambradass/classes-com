<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Private Plan | CNAT Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Libre+Franklin:wght@400..800&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#F4F1E9; --card:#FFFFFF; --ink:#0d1623; --muted:#5C6470;
  --spot:#2d7dd2; --bar-accent:#faed36; --hair:#DDD6C6; --hair2:#C9BFA8; --them:#A03B2E; --on-ink:#ffffff;
  --display:'Fraunces',Georgia,serif;
  --ui:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; display:grid; place-items:center; padding:24px 16px}
.gate{width:100%; max-width:440px; background:var(--card); border:1px solid var(--hair); border-top:4px solid var(--ink); padding:32px clamp(20px,6vw,36px) 28px; display:grid; gap:18px}
.logo{height:36px; width:auto; display:block}
.label{font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
h1{font-family:var(--display); font-weight:600; font-size:30px; line-height:1.1; margin:4px 0 0; text-wrap:balance}
p{margin:0; text-wrap:pretty}
form{display:grid; gap:14px}
.field{display:grid; gap:6px}
.field label{font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase}
input[type=password],input[type=text]{font:600 19px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em; color:var(--ink); background:var(--card); border:1.5px solid var(--hair2); border-radius:0; padding:12px 14px; min-height:50px; width:100%}
input:focus{outline:none; border-color:var(--spot); box-shadow:0 0 0 3px rgba(45,125,210,.2)}
.row{display:flex; align-items:center; gap:10px; min-height:44px; font-size:15px; color:var(--muted); cursor:pointer}
.row input{width:22px; height:22px; accent-color:var(--ink); margin:0}
.btn{appearance:none; min-height:50px; border:1.5px solid var(--ink); border-radius:6px; background:var(--ink); color:var(--on-ink); font:800 14px var(--ui); letter-spacing:.12em; text-transform:uppercase; cursor:pointer; transition:background .18s, color .18s}
.btn:hover,.btn:active{background:var(--card); color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--spot); outline-offset:3px}
.btn[disabled]{opacity:.6; cursor:progress}
.err{color:var(--them); font-size:15px; font-weight:600; min-height:1.4em}
.foot{border-top:1px solid var(--hair); padding-top:14px; font-size:14px; color:var(--muted)}
.noscript{color:var(--them); font-size:15px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main class="gate">
  <img class="logo" src="/img/cnat-logo-navy.png" alt="CNAT Title" width="114" height="36">
  <div>
    <span class="label">Private plan</span>
    <h1>Enter your password to open the plan</h1>
  </div>
  <p>Bradley Patterson at CNAT Title prepared this plan for you. Use the password he sent you by text.</p>
  <form id="f" autocomplete="off">
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" name="pw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </div>
    <label class="row" for="keep"><input id="keep" type="checkbox" checked> Keep me signed in on this device</label>
    <button class="btn" id="go" type="submit">Open plan</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <noscript><p class="noscript">This page needs JavaScript turned on to open.</p></noscript>
  <p class="foot">Trouble getting in? Email bpatterson@cnattitle.com.</p>
</main>

  var KEY = 'cnat-plan-' + P.id;
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function tob64(buf){ var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var salt = b64(P.salt), iv = b64(P.iv), ct = b64(P.ct);
  var err = document.getElementById('err'), go = document.getElementById('go'), pw = document.getElementById('pw'), keep = document.getElementById('keep');

  if (!window.crypto || !crypto.subtle) { err.textContent = 'This browser cannot open the plan. Try Safari or Chrome.'; go.disabled = true; return; }

  function derive(pass){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function open(key){
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct).then(function(pt){
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
      return key;
    });
  }
  function store(key){
    return crypto.subtle.exportKey('raw', key).then(function(raw){ try { localStorage.setItem(KEY, tob64(raw)); } catch (e) {} });
  }

  // Signed in before on this device: open straight away. Waits for load, because
  // document.open() is ignored while the parser is still running and the plan
  // would be appended under the gate instead of replacing it.
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  function autoOpen(){
    crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, true, ['decrypt']).then(open).catch(function(){
      try { localStorage.removeItem(KEY); } catch (e) {}
    });
  }
  if (saved) {
    if (document.readyState === 'complete') autoOpen(); else window.addEventListener('load', autoOpen);
  }

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var pass = pw.value.trim().toLowerCase();
    if (!pass) return;
    err.textContent = '';
    go.disabled = true; go.textContent = 'Opening...';
    derive(pass).then(function(key){
      var wantKeep = keep.checked;
      return open(key).then(function(k){ if (wantKeep) return store(k); });
    }).catch(function(){
      go.disabled = false; go.textContent = 'Open plan';
      err.textContent = 'That password did not work. Check the text from Bradley and try again.';
      pw.select();
    });
  });
})();
